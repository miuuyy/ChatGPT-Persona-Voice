name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up pinned uv for Windows package verification
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus libpipewire-0.3-dev pipewire wireplumber

      - name: Run contract tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build renderer
        run: bun run build:renderer

      - name: Compile native helpers
        run: bun run build:native

      - name: Test macOS and Windows native helpers
        if: runner.os != 'Linux'
        run: bun run test:native

      - name: Package Windows installer for startup verification
        if: runner.os == 'Windows'
        run: bun run scripts/package.cjs --win

      - name: Verify installed Windows renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke-installer.ps1

      - name: Test Linux native helpers in a private PipeWire session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/cpv-pipewire"
          config_dir="$RUNNER_TEMP/cpv-config"
          data_dir="$RUNNER_TEMP/cpv-data"
          state_dir="$RUNNER_TEMP/cpv-state"
          mkdir -p "$runtime_dir" "$config_dir" "$data_dir" "$state_dir"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export XDG_CONFIG_HOME="$config_dir"
          export XDG_DATA_HOME="$data_dir"
          export XDG_STATE_HOME="$state_dir"
          node scripts/linux-audio-policy.cjs install
          dbus-run-session -- bash -euo pipefail <<'SESSION'
          pipewire >"$RUNNER_TEMP/cpv-pipewire.log" 2>&1 &
          pipewire_pid=$!
          wireplumber >"$RUNNER_TEMP/cpv-wireplumber.log" 2>&1 &
          wireplumber_pid=$!
          trap 'kill "$wireplumber_pid" "$pipewire_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/pipewire-0" && wpctl status >/dev/null 2>&1 && break
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
          wpctl status >/dev/null
          bun run test:native
          SESSION
