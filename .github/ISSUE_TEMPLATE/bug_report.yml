name: Bug report
description: Report a reproducible launcher, engine, or target-native audio-path defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the platform matrix before reporting a platform-specific issue. Windows requires VB-CABLE to be installed separately and the selected app to be assigned to CABLE Input.
        Report sensitive audio, routes, paths, logs, or vulnerabilities through the private security link.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and read the troubleshooting/platform documentation.
          required: true
        - label: I removed private audio, credentials, usernames, and unnecessary local paths.
          required: true
        - label: This is not a security or privacy vulnerability requiring private disclosure.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Apple Silicon macOS 14.2+
        - Intel macOS
        - Windows x64 + NVIDIA (build 20348+)
        - Linux x64 + NVIDIA (WirePlumber 0.4)
        - Linux x64 + NVIDIA (WirePlumber 0.5)
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/build, architecture, GPU/driver, source commit, Bun/Node versions, and source or packaged run mode.
      placeholder: "OS/build, architecture, GPU/driver, audio stack, commit abc1234, Bun 1.3.x, Node 22.x, source or package"
    validations:
      required: true

  - type: input
    id: runtime_state
    attributes:
      label: Runtime state and code
      description: Include the exact Stopped/Armed/Running/Faulted state and stable blocker/error code when available.
      placeholder: "Faulted — seed_vc_worker_failed"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Select ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only the minimal relevant log/error lines and exact commands/results. Do not attach conversation audio by default.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include output device, permission state, selected source, or screenshots only when relevant and redacted.
